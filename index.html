<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PEXR | 로블록스 커뮤니티를 선도합니다</title>

  <meta property="og:title" content="PEXR | 로블록스 커뮤니티를 선도합니다" />
  <meta property="og:description" content="PEXR | Robloxコミュニティリーダー" />
  <meta property="og:image" content="http://pexr.kr/images/PEXR.png" />
  <meta property="og:url" content="https://pexr.kr" />
  <link rel="stylesheet" href="font.css">

  <style>
    body,
    html {
      height: 100%;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: "Freesentation", "Pretendard JP", sans-serif;
      background: linear-gradient(180deg, rgb(96, 193, 252) 0%, rgb(25, 94, 247) 100%);
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    img {
      width: 20%;
    }

    .text {
      font-size: 3vw;
      font-weight: 700;
      color: white;
      margin: 0;
    }

    button {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="container">
    <img src="/images/PEXR.svg" alt="이미지">
    <p class="text">사이트 준비 중</p>
  </div>
  <button></button>

  <script>
    var jp = false
    document.querySelector("button").onclick = function(){
      const p = document.querySelector('.text');
      jp = !jp
      p.textContent = jp ? 'サイト準備中' : '사이트 준비 중';
      document.title = jp ? 'PEXR | Robloxコミュニティリーダー' : 'PEXR | 로블록스 커뮤니티를 선도합니다';
    }
  </script>
</body>

</html>
